# Drop-in for the GNOME Shell user unit. Install as:
#   ~/.config/systemd/user/org.gnome.Shell@ubuntu.service.d/3fgdrag.conf
# (Ubuntu session; on other distros the unit is usually org.gnome.Shell@wayland.service
#  - check with: systemctl --user list-units 'org.gnome.Shell*')
#
#   LD_PRELOAD      - shim that turns on libinput's 3-finger drag (mutter never does)
#   LD_LIBRARY_PATH - patched libinput where 3 fingers always drag
# Only gnome-shell loads these; the system libinput is untouched.
# Revert: delete this file, `systemctl --user daemon-reload`, log out and back in.
[Service]
Environment=LD_PRELOAD=%h/.local/lib/3fgdrag.so
Environment=LD_LIBRARY_PATH=%h/.local/lib/libinput-3fg/lib/x86_64-linux-gnu
